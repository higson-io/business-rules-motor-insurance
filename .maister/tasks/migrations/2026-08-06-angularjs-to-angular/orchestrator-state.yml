task_context:
  clarifications_resolved: true
  decisions:
    C-1_ui_library: "Angular Material (MatDatepicker, MatTooltip, MatProgressSpinner) - accepted visual change"
    C-2_workspace_layout: "frontend/ sibling directory at repo root"
    C-3_defects: "Fix all ~19 latent defects during migration; mandatory enumerated defect register"
    C-4_parity_evidence: "MockMvc API contract tests + Playwright E2E golden before/after + screenshot comparison"
    C-5_node_toolchain: >
      OD-E resolved: bump Node locally only. NO .nvmrc, NO frontend-maven-plugin. exec-maven-plugin
      stays as-is and keeps depending on whatever npm is on PATH. Accepted consequence: the next
      person (or a future CI) hits the same opaque prepare-package failure. Not a Docker-image
      concern - the image never builds the frontend, it only COPYs target/motor-insurance.war.
      P-1 RESOLVED 2026-08-06: `brew install node@22` -> Node 22.23.2 + npm 10.9.8 at
      /opt/homebrew/opt/node@22/bin. Satisfies ^22.22.3. It is KEG-ONLY and the user declined
      any ~/.zshrc modification, so it is NOT on the default PATH - the machine's default `node`
      is still 23.6.1. EVERY npm/ng/mvn invocation must therefore be prefixed with:
        export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
      Maven's exec-maven-plugin resolves npm from the PATH present when Maven launches, so a bare
      `mvn package` in a fresh shell WILL still fail opaquely. Nothing is committed to fix this
      (C-5); document it in Readme.md as part of G13.
    C-6_backend_in_scope: >
      OD-G resolved: DR-14 accepted - GlobalExceptionHandler moves @ControllerAdvice ->
      @RestControllerAdvice (~5 lines of Java). This is a deliberate, enumerated register entry.
      Consequence: the golden contract for a failed GET quote moves from 404-with-empty-body to
      400-with-message, so the MockMvc contract tests must encode the NEW behaviour deliberately.
      Scope is therefore frontend + this one backend file.
    C-7_DR06_error_handling: >
      Accepted narrowly: the 14 currently-silent mutation calls surface failures through the
      SAME red banner that already exists for the quote error. No new UI elements, no per-field
      messages, no retry, no value rollback.
  open_decisions:
    - "OD-A: coverage.description is HTML but MatTooltip is text-only - needs CdkOverlay popover or plain-text degradation"
    - "OD-B: RESOLVED in Phase 2 - ship no <base> element at all; context-path-agnostic"
    - "OD-E: RESOLVED by C-5 - bump Node locally only; still ACTIONABLE, machine is on 23.6.1"
    - "OD-G: RESOLVED by C-6 - backend GlobalExceptionHandler fix is in scope"
    - "OD-C: keep Bootstrap 3 CSS for grid + alert alongside Material, or re-implement grid"
    - "OD-D: Angular Material theming vs existing LESS design tokens (#4C4CDE, 8px radius, notched-outline inputs)"
    - "OD-E: BLOCKER - Node 23.6.1 rejected by Angular 22 (^22.22.3 || ^24.15.0 || >=26.0.0); needs .nvmrc + toolchain baseline or frontend-maven-plugin"
    - "OD-F: Font Awesome 4 + 90 vendored Open Sans files + Manrope CDN vs Material icon font"
  parity_definition: >
    Functional parity of user-visible capability and of the backend contract - NOT bug-for-bug
    and NOT pixel-for-pixel. Sanctioned deviations: the 4 Material-replaced controls (C-1) and
    the enumerated defect register (C-3). Anything else is a regression.

