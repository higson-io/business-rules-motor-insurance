<span class="coverage__sum" data-testid="coverage-premium">{{ premium() | number: '1.2-2' }}</span>

<span class="coverage__text" data-testid="coverage-limit">
	{{ limitLeft() | number: '1.2-2' }}
	@if (limitRight(); as right) {
		<span>/ {{ right | number: '1.2-2' }}</span>
	}
</span>

<!--
	The composition bar: this coverage's share of its tier's pre-discount premium.

	⚠️ It renders NO TEXT, deliberately, so it contributes nothing to the rendered-text comparisons
	the E2E goldens make. The share is exposed to assistive technology through `aria-label`, which
	`innerText` does not see either.
-->
<span
	class="coverage__composition"
	role="img"
	[attr.aria-label]="(share() * 100 | number: '1.0-0') + '% of the tier premium'"
>
	<span class="coverage__composition__fill" [style.width.%]="share() * 100"></span>
</span>
