<div class="discounts" data-testid="discount-row">
	<div class="discounts__table-container">
		<table class="discounts__table-container__table">
			<tbody>
				<tr>
					<td data-testid="discount-name">{{ name() }}</td>
					<!-- The `-` is a literal prefix, exactly as in `discount.html:11`: `value` is sent
					     as a positive number and no currency symbol is added anywhere (DR-10). -->
					<td data-testid="discount-value">-{{ value() | number: '1.2-2' }}</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
