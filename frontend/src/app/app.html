<!--
	The shell: menubar, spinner, and the switch between the landing screen and a demo.

	The Bootstrap 3 grid of `main.html:1-22` (`.container` → `.row` → `.col-md-3` + `.col-md-9`) is
	gone with Bootstrap itself (C-9). CSS Grid over the class names below replaces it, preserving
	Bootstrap's own 992px collapse point (`responsive.md`). The grid itself moved into `moto.html`
	along with the screen it lays out.
-->
<div class="app-shell">
	<!--
		The one loading indicator in the application, driven by the interceptor-fed counter and by
		nothing else. It sits outside the layout so it can be positioned over the viewport.

		⛔ ND-6 — this spinner used to FLASH at startup, because the eight AngularJS `templateUrl`
		fetches passed through the same `$http` interceptor that drove it. Compiled templates issue
		no such requests, so the flash disappears by construction. That is a sanctioned
		disappearance (OD-13), not a regression: do NOT add an artificial delay to reproduce it,
		and do not assert it.
	-->
	@if (pendingRequests.count() > 0) {
		<app-spinner />
	}

	<!--
		The menubar carried the logo and nothing else (parity checklist §1). It now also carries the
		way back out of a demo, which is new and unavoidable: without a router there is no browser
		affordance for leaving one. It appears only inside a demo, so the landing screen is
		unchanged from what the parity checklist describes.
	-->
	<div class="menubar">
		@if (demo()) {
			<button
				type="button"
				class="menubar__back"
				data-testid="back-to-demos"
				(click)="backToDemos()"
			>
				<span aria-hidden="true">&#8592;</span> All demos
			</button>
		}

		<div class="logo" role="img" aria-label="Insurance app"></div>
	</div>

	<!--
		⛔ Each demo is created only once it is opened. That is what keeps the landing screen free of
		requests: `QuoteStore` is `providedIn: 'root'` and its resources load when it is first
		injected, which happens no earlier than the first motor component being constructed.

		Adding an industry means one more `@case` here, one entry in `demo-catalog.ts` and one
		component — nothing else in the application changes.
	-->
	@switch (demo()) {
		@case ('moto') {
			<app-moto />
		}
		@case ('life') {
			<app-life />
		}
		@default {
			<app-demo-picker />
		}
	}
</div>
