<!--
	Data początku ochrony stoi NAD wyborem ścieżki, bo dotyczy obu. Kopia w każdej ścieżce
	pozwoliłaby obu ekranom twierdzić, że wyceniają według innej wersji taryfy.
-->
<app-error-banner [loadError]="loadError()" testId="life-error-banner" />

<app-life-effective-date />

<!--
	The two paths. Tabs rather than a dropdown: there are two, both are always available, and the
	choice is worth showing rather than hiding behind a control that has to be opened.
-->
<div class="life-paths" role="tablist" aria-label="Rodzaj ubezpieczenia">
	<button
		type="button"
		role="tab"
		class="life-paths__tab"
		id="life-tab-individual"
		aria-controls="life-panel-individual"
		data-testid="life-path-individual"
		[class.life-paths__tab--on]="path() === 'individual'"
		[attr.aria-selected]="path() === 'individual'"
		(click)="open('individual')"
	>
		Indywidualne
		<span class="life-paths__tab__note">umowa główna + umowy dodatkowe</span>
	</button>

	<button
		type="button"
		role="tab"
		class="life-paths__tab"
		id="life-tab-group"
		aria-controls="life-panel-group"
		data-testid="life-path-group"
		[class.life-paths__tab--on]="path() === 'group'"
		[attr.aria-selected]="path() === 'group'"
		(click)="open('group')"
	>
		Grupowe
		<span class="life-paths__tab__note">program pracowniczy, warianty I–III</span>
	</button>
</div>

<!--
	⛔ role="tabpanel" wymaga id, na które wskazuje aria-controls zakładki, i aria-labelledby
	wskazującego z powrotem. Bez tej pary czytnik ekranu ogłasza dwa przyciski i osierocony obszar,
	czyli dokładnie to, czego role="tab" miało uniknąć.
-->
@switch (path()) {
	@case ('group') {
		<div id="life-panel-group" role="tabpanel" aria-labelledby="life-tab-group">
			<app-life-group />
		</div>
	}
	@default {
		<div id="life-panel-individual" role="tabpanel" aria-labelledby="life-tab-individual">
			<app-life-individual />
		</div>
	}
}

<!--
	Jedna klauzula na całe demo, a nie kopia w każdej ścieżce. Obie ścieżki miały własną, identyczną
	co do słowa — dwa miejsca do rozjechania się w treści, która jest prawna.
-->
<p class="life__disclaimer">
	Wyliczenie poglądowe na potrzeby demonstracji. Nie stanowi oferty w rozumieniu art. 66 Kodeksu
	cywilnego.
</p>
