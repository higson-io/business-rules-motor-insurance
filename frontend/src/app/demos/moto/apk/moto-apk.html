<!--
	Sama ankieta. Data początku ochrony wyszła stąd do `app-moto-effective-date` nad paskiem
	kroków — jest kontekstem całej wyceny, a nie odpowiedzią na pytanie, i ma stać w tym samym
	miejscu we wszystkich trzech demach.
-->
<section class="moto-apk">
	@if (ready()) {
		<app-apk-questionnaire
			[questions]="questions()"
			[copy]="copy"
			(answered)="onAnswered($event)"
			(refusalToggled)="onRefusalToggled($event)"
		/>
	}
</section>
