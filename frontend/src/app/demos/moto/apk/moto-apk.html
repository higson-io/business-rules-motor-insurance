<!--
	Analiza potrzeb nad tabelą porównawczą, bo w tej kolejności rozmawia się z klientem: najpierw
	czego potrzebuje, potem ile to kosztuje.

	⛔ CAŁY ten ekran mówi po angielsku — napisy komponentu, treść pytań w Higsonie i tabela
	porównawcza. ND-2 przypina angielskie etykiety demo komunikacyjnego, więc to on wyznacza język,
	a nie odwrotnie. Demo życiowe i majątkowe są po polsku i to jest w porządku: język jest cechą
	ekranu. Mieszanie dwóch języków na jednym ekranie nie jest.
-->
<section class="moto-apk">
	<div class="date-band">
		<div class="date-band__control">
			<mat-form-field appearance="outline" class="date-band__field">
				<mat-label>Policy start date</mat-label>
				<input
					matInput
					data-testid="moto-start-date"
					[matDatepicker]="picker"
					[value]="startDate()"
					(dateChange)="pickDate($event.value)"
				/>
				<mat-datepicker-toggle matIconSuffix [for]="picker" />
				<mat-datepicker #picker />
			</mat-form-field>
		</div>

		@if (regime(); as regime) {
			<div class="date-band__regime">
				<p class="date-band__caption">Needs analysis regime</p>
				<p class="date-band__name" data-testid="moto-regime">{{ regime.name }}</p>
				@if (regime.legalBasis; as basis) {
					<p class="date-band__basis">{{ basis }}</p>
				}
			</div>

			<div class="date-band__reading" data-testid="moto-reading">
				<div class="date-band__figure">
					<span class="date-band__number">{{ visibleCount() }}</span>
					<span class="date-band__unit">questions asked</span>
				</div>
			</div>
		}
	</div>

	@if (ready()) {
		<app-apk-questionnaire
			[questions]="questions()"
			[copy]="copy"
			(answered)="onAnswered($event)"
			(refusalToggled)="onRefusalToggled($event)"
		/>
	}
</section>
