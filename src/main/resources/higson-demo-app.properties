# point this to Higson Studio Database (version 4.0.2 or later)
# download and extract Higson Bundle from: https://higson.io/download
# dialect is auto-detected from the JDBC URL by the Higson runtime starter;
# schema is selected via the driver's currentSchema (leave higson.database.schema unset so it
# is not applied as a runtime-qualified schema - e.g. the H2 demo uses the default PUBLIC schema)
higson.database.url=jdbc:postgresql://localhost:10432/higson?currentSchema=public
higson.database.username=higson
higson.database.password=higson

# enable to see unpublished changes made in Higson Studio by a given user
higson.runtime.dev-mode-enabled=false
higson.runtime.username=admin

# validate function argument data types at runtime (kept enabled as before the starter migration)
higson.runtime.function.validate-arguments=true

# instance name identifying this runtime in Higson diagnostics (saved to the database)
higson.runtime.instance-name=motor-insurance-demo

# engine diagnostic profiler (per-invocation call-stacks flushed to the database)
higson.runtime.diagnostic.profiler.enabled=false

server.port=48080
server.servlet.context-path=/demo

# enable when behind proxy
#server.use-forward-headers=true
