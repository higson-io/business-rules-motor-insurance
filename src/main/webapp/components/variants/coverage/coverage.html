<div class="coverage"
     data-testid="coverage-row"
     tooltips
     tooltip-template="{{ctrl.description}}"
     tooltip-class="common-tooltip"
     tooltip-side="right"
     tooltip-size="large">
    <div class="coverage__header" data-testid="coverage-header">
        {{ctrl.name}} ({{ctrl.code}})
    </div>
    <div class="coverage__content">
        <div class="coverage__text" data-testid="coverage-limit">
            {{ctrl.limitLeft | number: 2}}
            <span ng-if="ctrl.limitRight">/ {{ctrl.limitRight | number: 2}}</span>
        </div>
        <div class="coverage__sum" data-testid="coverage-premium">
            {{ctrl.premium | number: 2}}
        </div>
    </div>
</div>
