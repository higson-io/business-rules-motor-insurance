higson.database.url=${HIGSON_DATABASE_URL}
higson.database.username=sa
higson.database.password=sa
# dialect is auto-detected from the JDBC URL by the Higson runtime starter

# enable to see unpublished changes made in Higson Studio by a given user
higson.runtime.dev-mode-enabled=false
higson.runtime.username=admin

# validate function argument data types at runtime (kept enabled as before the starter migration)
higson.runtime.function.validate-arguments=true

# engine diagnostic profiler - toggle via HIGSON_RUNTIME_DIAGNOSTIC_PROFILER_ENABLED env var
higson.runtime.diagnostic.profiler.enabled=${HIGSON_RUNTIME_DIAGNOSTIC_PROFILER_ENABLED:false}

server.port=48080
